services:
  - type: web
    name: ammar-portfolio
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /
    healthCheckProtocol: HTTP
    maxInstanceCount: 1
    minInstanceCount: 1

    # Environment variables (set APP_KEY in Render dashboard)
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite

    # Port configuration for Render
    port: 8080

    # Auto-deploy on push
    deploy:
      fromRepo:
        branch: main
